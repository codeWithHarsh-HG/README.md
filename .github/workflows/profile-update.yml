name: Update Profile README

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update timestamp
        run: |
          current_date=$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')
          sed -E -i "s|^Last updated automatically:.*<!-- LAST_UPDATED -->$|Last updated automatically: ${current_date} <!-- LAST_UPDATED -->|" README.md

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update profile timestamp"
          git push
